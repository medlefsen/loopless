name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned so CI matches ./build.sh and the glibc floor stays predictable.
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./install-build-deps.sh

      - name: Build
        run: ./do-build.sh build_linux

      - name: Smoke test
        run: ./test.sh

      - name: Package
        run: ./package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: loopless-x86_64-linux
          path: dist/
